<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Cocoa Society</title>

  <!-- Leaflet CSS -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <!-- Estilos propios -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Barra superior -->
  <header class="topbar">
    <!-- 2 logos a la izquierda -->
    <div class="topbar-logos topbar-logos-left">
      <img src="logo_unibonn.png" alt="Universität Bonn" />
      <img src="logo_zef.png" alt="ZEF - Center for Development Research" />
    </div>

    <!-- Centro: título y selector de mapa -->
    <div class="topbar-center">
      <h1>
        The Cocoa Society
      </h1>

      <div class="basemap-select">
        <label for="basemap">Mapa base:</label>
        <select id="basemap">
          <option value="voyager">Mapbox style (Voyager)</option>
          <option value="positron">Mapbox Light style</option>
          <option value="osm">OpenStreetMap</option>
          <option value="esri">Esri World Imagery</option>
        </select>
      </div>
    </div>

    <!-- 2 logos a la derecha -->
    <div class="topbar-logos topbar-logos-right">
      <img src="logo_rlc.png" alt="Right Livelihood College" />
      <img src="logo_fiat_panis.png" alt="Foundation fiat panis" />
    </div>
  </header>

  <!-- Panel lateral + mapa -->
  <main>
    <aside class="panel">
      <div class="panel-section">
        <h3>Capas</h3>
        <div id="layerList" class="layer-list"></div>
      </div>

      <div class="panel-section transition-widget">
        <h3>Transición multitemporal</h3>

        <div id="transitionStatus" class="transition-status">
          Cargando capas de transición…
        </div>

        <div class="transition-controls-row">
          <button id="transitionPrev" type="button" title="Capa anterior">◀</button>
          <button id="transitionPlay" type="button" title="Reproducir animación">▶</button>
          <button id="transitionNext" type="button" title="Capa siguiente">▶</button>
        </div>

        <input
          id="transitionSlider"
          class="transition-slider"
          type="range"
          min="0"
          max="0"
          value="0"
          step="1"
          disabled
        />

        <div id="transitionCurrentLabel" class="transition-current-label">
          Sin capas cargadas
        </div>

        <label class="transition-opacity-label" for="transitionOpacity">
          Opacidad de transición
        </label>
        <input
          id="transitionOpacity"
          class="transition-slider"
          type="range"
          min="0"
          max="1"
          value="0.55"
          step="0.05"
        />

        <div class="transition-options">
          <label>
            <input id="transitionKeepPrevious" type="checkbox" />
            Combinar con capas anteriores
          </label>
          <label>
            <input id="transitionAutoFit" type="checkbox" checked />
            Acercar al cambiar capa
          </label>
        </div>

        <div id="transitionLayerList" class="transition-layer-list"></div>
      </div>

      <div class="panel-section">
        <h3>Leyenda</h3>
        <div id="legend" class="legend">
          <p>Activa o desactiva las capas desde el panel izquierdo.</p>
        </div>
      </div>

      <div class="panel-section">
        <h3>Info</h3>
        <p>Haz click sobre los elementos del mapa para ver sus atributos.</p>
      </div>
    </aside>

    <div id="map"></div>
  </main>

  <footer class="footer">
    <span>© Elaborado por Geopaz_Eguez&Pazmiño</span>
  </footer>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- topojson-client: decodifica TopoJSON (Parroquial.topo.json, Provincial.topo.json) a GeoJSON en el navegador -->
  <script src="https://unpkg.com/topojson-client@3/dist/topojson-client.min.js"></script>

  <!-- Lógica del mapa -->
  <script src="script.js"></script>
</body>
</html>
